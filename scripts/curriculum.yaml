# 커리큘럼 — 비개발자가 바이브코딩할 때 필요한 지식
#
# 이 파일이 이 블로그의 설계도입니다. 무엇을 어떤 순서로 가르칠지가 여기 있고,
# teacher.py 가 이걸 읽어 "오늘 무엇을 쓸지"를 정합니다.
#
# 기존 topics.yaml 과 결정적으로 다른 점은 '순서'입니다.
# 정보성 요약은 아무 주제나 먼저 써도 됐지만, 교육은 선수 지식이 있습니다.
# 터미널을 모르는 사람에게 환경변수를 설명할 수 없습니다.
#
# ── 필드 ──────────────────────────────────────────────────────────
# id            : 글의 cluster 필드에 기록. 바꾸면 기존 글과 연결이 끊어집니다.
# track         : 소속 트랙
# goal          : 이 글을 읽고 나면 독자가 할 수 있게 되는 것. 한 문장, 행동으로.
# prerequisites : 먼저 발행되어 있어야 하는 레슨 id. 비어 있으면 진입점.
# teaches       : 이 글에서 처음 설명하는 용어. jargon.py 의 누적 인덱스에 들어갑니다.
# stack         : none | web | python | shell  (예시 코드의 언어. none 은 코드 없음)
#
# 레슨을 추가하려면 항목을 하나 더 쓰면 됩니다. 코드 수정은 필요 없습니다.

tracks:
  - id: ai-coding
    name: AI로 만들기
    about: AI 코딩 도구를 다루는 법. 이 블로그의 진입점입니다.
  - id: dev-env
    name: 작업 환경
    about: 터미널, 파일, 에디터, git. 뭘 하든 이게 깔려 있어야 합니다.
  - id: prog-basics
    name: 프로그래밍 최소 개념
    about: 코드를 직접 쓰기 위해서가 아니라, AI가 준 코드를 읽기 위해서입니다.
  - id: how-web-works
    name: 웹은 어떻게 도는가
    about: 만든 것이 왜 내 컴퓨터에서만 되는지 이해하기 위한 배경.
  - id: ship-it
    name: 세상에 내놓기
    about: 배포, 도메인, 비밀 관리, 비용. 만드는 것보다 여기서 더 많이 막힙니다.
  - id: it-literacy
    name: IT 일반 교양
    about: 개발과 직접 상관없지만 알아두면 대화가 통하는 것들.

lessons:
  # ── AI로 만들기 ────────────────────────────────────────────────
  - id: what-is-vibe-coding
    track: ai-coding
    goal: "바이브코딩으로 무엇을 만들 수 있고 무엇을 기대하면 안 되는지 구분할 수 있다"
    prerequisites: []
    teaches: [바이브코딩, 프롬프트, 코드베이스]
    stack: none

  - id: choosing-ai-tool
    track: ai-coding
    goal: "채팅형 AI와 에디터 통합형 AI의 차이를 알고 상황에 맞게 고를 수 있다"
    prerequisites: [what-is-vibe-coding]
    teaches: [에이전트, IDE, 자동완성]
    stack: none

  - id: writing-good-prompt
    track: ai-coding
    goal: "원하는 결과를 얻기 위해 요청에 무엇을 포함해야 하는지 안다"
    prerequisites: [choosing-ai-tool]
    teaches: [컨텍스트, 요구사항 명세]
    stack: none

  - id: reading-ai-output
    track: ai-coding
    goal: "AI가 준 코드에서 무엇을 하는 부분인지 최소한으로 짚어낼 수 있다"
    prerequisites: [writing-good-prompt, what-is-code]
    teaches: [주석, 들여쓰기, 실행 흐름]
    stack: python

  - id: when-ai-is-wrong
    track: ai-coding
    goal: "AI가 그럴듯하게 틀렸을 때를 알아채는 신호를 안다"
    prerequisites: [reading-ai-output, what-is-error]
    teaches: [환각, 최신성 문제]
    stack: none

  - id: iterating-with-ai
    track: ai-coding
    goal: "안 되는 코드를 AI에게 고쳐달라고 효과적으로 요청할 수 있다"
    prerequisites: [when-ai-is-wrong]
    teaches: [재현 절차, 에러 로그 공유]
    stack: none

  - id: ai-context-limits
    track: ai-coding
    goal: "AI가 내 프로젝트 전체를 못 보는 이유를 알고 필요한 파일을 짚어줄 수 있다"
    prerequisites: [iterating-with-ai, what-is-file-folder]
    teaches: [컨텍스트 윈도우, 토큰]
    stack: none

  - id: ai-coding-safety
    track: ai-coding
    goal: "AI가 만든 코드를 그대로 실행하기 전에 확인할 것을 안다"
    prerequisites: [ai-context-limits, what-is-secret]
    teaches: [의존성, 임의 코드 실행]
    stack: shell

  # ── 작업 환경 ──────────────────────────────────────────────────
  - id: what-is-file-folder
    track: dev-env
    goal: "절대경로와 상대경로를 구분하고 파일 위치를 정확히 말할 수 있다"
    prerequisites: []
    teaches: [경로, 절대경로, 상대경로, 확장자, 숨김 파일]
    stack: none

  - id: what-is-terminal
    track: dev-env
    goal: "터미널을 열고 현재 위치를 확인하고 폴더를 이동할 수 있다"
    prerequisites: [what-is-file-folder]
    teaches: [터미널, 셸, 명령어, 작업 디렉터리]
    stack: shell

  - id: text-editor-basics
    track: dev-env
    goal: "코드 에디터로 프로젝트 폴더를 열고 파일을 찾을 수 있다"
    prerequisites: [what-is-file-folder]
    teaches: [코드 에디터, 문법 강조, 워크스페이스]
    stack: none

  - id: what-is-package-manager
    track: dev-env
    goal: "남이 만든 코드를 설치한다는 것이 무슨 뜻인지 알고 설치 명령을 읽을 수 있다"
    prerequisites: [what-is-terminal]
    teaches: [패키지, 패키지 매니저, 라이브러리, 버전]
    stack: shell

  - id: what-is-git
    track: dev-env
    goal: "버전 관리가 왜 필요한지 알고 git이 무엇을 저장하는지 설명할 수 있다"
    prerequisites: [what-is-terminal, what-is-file-folder]
    teaches: [버전 관리, 저장소, 커밋]
    stack: none

  - id: git-basic-flow
    track: dev-env
    goal: "변경한 내용을 커밋하고 되돌릴 수 있다"
    prerequisites: [what-is-git]
    teaches: [스테이징, 브랜치, 되돌리기]
    stack: shell

  - id: what-is-github
    track: dev-env
    goal: "내 컴퓨터의 코드를 원격 저장소에 올리고 왜 그래야 하는지 안다"
    prerequisites: [git-basic-flow]
    teaches: [원격 저장소, 푸시, 클론]
    stack: shell

  - id: project-structure
    track: dev-env
    goal: "처음 보는 프로젝트 폴더에서 어디부터 봐야 할지 안다"
    prerequisites: [what-is-package-manager, what-is-git]
    teaches: [설정 파일, 진입점, 의존성 목록]
    stack: none

  # ── 프로그래밍 최소 개념 ───────────────────────────────────────
  - id: what-is-code
    track: prog-basics
    goal: "코드가 위에서 아래로 실행된다는 것과 실행이 무엇인지 설명할 수 있다"
    prerequisites: []
    teaches: [코드, 실행, 인터프리터, 구문]
    stack: python

  - id: variables-and-types
    track: prog-basics
    goal: "변수에 값을 담고 문자열과 숫자를 구분할 수 있다"
    prerequisites: [what-is-code]
    teaches: [변수, 자료형, 문자열, 정수, 불리언]
    stack: python

  - id: what-is-error
    track: prog-basics
    goal: "에러 메시지에서 어디가 문제인지 찾아낼 수 있다"
    prerequisites: [variables-and-types]
    teaches: [에러, 예외, 스택 트레이스, 줄 번호]
    stack: python

  - id: conditions
    track: prog-basics
    goal: "조건에 따라 다르게 동작하는 코드를 읽을 수 있다"
    prerequisites: [variables-and-types]
    teaches: [조건문, 비교 연산자, 참과 거짓]
    stack: python

  - id: loops
    track: prog-basics
    goal: "반복되는 코드를 읽고 몇 번 도는지 셀 수 있다"
    prerequisites: [conditions]
    teaches: [반복문, 순회, 무한 루프]
    stack: python

  - id: functions
    track: prog-basics
    goal: "함수가 입력을 받아 출력을 낸다는 구조를 읽을 수 있다"
    prerequisites: [loops]
    teaches: [함수, 인자, 반환값, 호출]
    stack: python

  - id: lists-and-objects
    track: prog-basics
    goal: "여러 값을 담은 목록과 이름표가 붙은 데이터를 구분해 읽을 수 있다"
    prerequisites: [functions]
    teaches: [리스트, 배열, 딕셔너리, 객체, 키와 값]
    stack: python

  - id: debugging-basics
    track: prog-basics
    goal: "값을 중간에 찍어보며 어디서 잘못됐는지 좁혀갈 수 있다"
    prerequisites: [what-is-error, functions]
    teaches: [디버깅, 출력 확인, 최소 재현]
    stack: python

  # ── 웹은 어떻게 도는가 ─────────────────────────────────────────
  - id: client-and-server
    track: how-web-works
    goal: "브라우저와 서버가 각각 무엇을 하는지 구분할 수 있다"
    prerequisites: []
    teaches: [클라이언트, 서버, 브라우저, 요청]
    stack: none

  - id: what-is-http
    track: how-web-works
    goal: "주소창에 주소를 넣었을 때 무슨 일이 일어나는지 설명할 수 있다"
    prerequisites: [client-and-server]
    teaches: [HTTP, 요청과 응답, 상태 코드, 헤더]
    stack: none

  - id: what-is-api
    track: how-web-works
    goal: "API가 무엇이고 왜 필요한지 설명할 수 있다"
    prerequisites: [what-is-http]
    teaches: [API, 엔드포인트, 파라미터]
    stack: none

  - id: what-is-json
    track: how-web-works
    goal: "JSON 데이터를 읽고 원하는 값을 짚어낼 수 있다"
    prerequisites: [what-is-api, lists-and-objects]
    teaches: [JSON, 중첩 구조, 파싱]
    stack: python

  - id: frontend-vs-backend
    track: how-web-works
    goal: "화면 쪽 코드와 서버 쪽 코드를 구분하고 어디를 고쳐야 할지 판단할 수 있다"
    prerequisites: [client-and-server, what-is-code]
    teaches: [프론트엔드, 백엔드, 렌더링]
    stack: web

  - id: html-css-minimum
    track: how-web-works
    goal: "화면에 보이는 요소가 어느 코드에서 나오는지 찾아 고칠 수 있다"
    prerequisites: [frontend-vs-backend]
    teaches: [HTML, 태그, CSS, 선택자, 스타일]
    stack: web

  - id: browser-devtools
    track: how-web-works
    goal: "브라우저 개발자 도구로 화면 요소와 오류를 직접 확인할 수 있다"
    prerequisites: [html-css-minimum, what-is-error]
    teaches: [개발자 도구, 콘솔, 요소 검사, 네트워크 탭]
    stack: web

  - id: calling-api-yourself
    track: how-web-works
    goal: "실제로 공개 API를 호출해서 결과를 받아볼 수 있다"
    prerequisites: [what-is-json, what-is-terminal]
    teaches: [요청 보내기, 응답 확인, 인증 키]
    stack: python

  - id: what-is-database
    track: how-web-works
    goal: "데이터를 어디에 저장하는지, 파일과 무엇이 다른지 설명할 수 있다"
    prerequisites: [frontend-vs-backend]
    teaches: [데이터베이스, 테이블, 쿼리, 스키마]
    stack: none

  - id: what-is-auth
    track: how-web-works
    goal: "로그인이 유지되는 구조를 설명할 수 있다"
    prerequisites: [what-is-api, what-is-database]
    teaches: [인증, 인가, 세션, 토큰, 쿠키]
    stack: none

  # ── 세상에 내놓기 ──────────────────────────────────────────────
  - id: what-is-deploy
    track: ship-it
    goal: "내 컴퓨터에서만 되는 이유를 알고 배포가 무엇인지 설명할 수 있다"
    prerequisites: [client-and-server, what-is-terminal]
    teaches: [배포, 로컬, 호스팅, 빌드]
    stack: none

  - id: static-hosting
    track: ship-it
    goal: "정적 사이트를 무료 호스팅에 올려 주소를 얻을 수 있다"
    prerequisites: [what-is-deploy, what-is-github]
    teaches: [정적 사이트, 배포 자동화]
    stack: shell

  - id: what-is-secret
    track: ship-it
    goal: "API 키를 코드에 직접 쓰면 안 되는 이유와 유출 시 벌어지는 일을 안다"
    prerequisites: [what-is-api, what-is-git]
    teaches: [비밀 값, API 키, 유출]
    stack: none

  - id: env-vars
    track: ship-it
    goal: "비밀 값을 환경변수로 분리하고 저장소에 올라가지 않게 할 수 있다"
    prerequisites: [what-is-secret, what-is-terminal]
    teaches: [환경변수, .env 파일, gitignore]
    stack: shell

  - id: what-is-domain
    track: ship-it
    goal: "도메인을 사서 내 사이트에 연결하는 과정을 이해한다"
    prerequisites: [what-is-deploy]
    teaches: [도메인, DNS, 네임서버, 전파]
    stack: none

  - id: reading-logs
    track: ship-it
    goal: "배포한 사이트가 안 될 때 로그에서 단서를 찾을 수 있다"
    prerequisites: [static-hosting, what-is-error]
    teaches: [로그, 빌드 실패, 런타임 오류]
    stack: none

  - id: understanding-cost
    track: ship-it
    goal: "무료 한도가 무엇을 기준으로 계산되는지 알고 예상 비용을 가늠할 수 있다"
    prerequisites: [what-is-deploy]
    teaches: [종량제, 무료 한도, 트래픽]
    stack: none

  - id: backup-and-rollback
    track: ship-it
    goal: "망가뜨렸을 때 이전 상태로 되돌릴 수 있다"
    prerequisites: [git-basic-flow, static-hosting]
    teaches: [롤백, 백업, 배포 이력]
    stack: shell

  # ── IT 일반 교양 ───────────────────────────────────────────────
  - id: what-is-network
    track: it-literacy
    goal: "집의 인터넷이 바깥과 어떻게 연결되는지 큰 그림을 설명할 수 있다"
    prerequisites: []
    teaches: [네트워크, 라우터, 회선, 대역폭]
    stack: none

  - id: what-is-os
    track: it-literacy
    goal: "운영체제가 무슨 일을 하는지, 프로그램이 실행된다는 게 뭔지 안다"
    prerequisites: []
    teaches: [운영체제, 프로세스, 메모리]
    stack: none

  - id: what-is-ip-dns
    track: it-literacy
    goal: "도메인 이름이 실제 주소로 바뀌는 과정을 설명할 수 있다"
    prerequisites: [what-is-network]
    teaches: [IP 주소, 공인 IP, 사설 IP, DNS 조회]
    stack: shell

  - id: what-is-cloud
    track: it-literacy
    goal: "클라우드가 남의 컴퓨터를 빌리는 것이라는 점과 무엇이 편한지 안다"
    prerequisites: [what-is-network]
    teaches: [클라우드, 가상 서버, 리전]
    stack: none

  - id: security-basics
    track: it-literacy
    goal: "계정을 지키는 최소한의 조치를 실제로 적용할 수 있다"
    prerequisites: [what-is-network]
    teaches: [2단계 인증, 비밀번호 관리자, 피싱]
    stack: none

  - id: what-is-encryption
    track: it-literacy
    goal: "주소창 자물쇠가 무엇을 보장하고 무엇을 보장하지 않는지 안다"
    prerequisites: [security-basics, what-is-http]
    teaches: [암호화, HTTPS, 인증서]
    stack: none

  - id: personal-data
    track: it-literacy
    goal: "서비스에서 개인정보를 다룰 때 최소한으로 지켜야 할 것을 안다"
    prerequisites: [what-is-database, security-basics]
    teaches: [개인정보, 수집 최소화, 보관 기간]
    stack: none

  - id: how-ai-models-work
    track: it-literacy
    goal: "LLM이 답을 만드는 방식을 대략 알고 왜 틀리는지 이해한다"
    prerequisites: [what-is-api]
    teaches: [언어 모델, 학습 데이터, 추론, 확률]
    stack: none

# 한 트랙만 깊어지지 않도록, 직전 N편과 같은 트랙이면 감점합니다.
