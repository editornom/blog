# 토픽 클러스터 정의
#
# 정보성 블로그는 낱개 글이 아니라 '클러스터'로 자랍니다.
# 하나의 허브 주제 아래 구체적인 질문들(스포크)이 쌓이고, 그 글들이 서로 연결될 때
# 독자는 한 편을 읽고 다음 편으로 이동하며, 검색엔진도 그 영역의 깊이를 인식합니다.
#
# 기존 파이프라인은 매일 '오늘 화제인 것'을 골랐습니다. 그래서 914편이 서로
# 아무 관계도 없는 낱개 글로 흩어졌고, 내부 링크는 최신 2편을 기계적으로 붙일
# 뿐이었습니다. 이 파일이 그 구조를 대체합니다.
#
# id      : 프론트매터 cluster 필드에 기록되는 값. 바꾸면 기존 글과 연결이 끊어집니다.
# hub     : 이 클러스터가 다루는 영역
# reader  : 이 영역을 검색하는 사람이 처한 상황 (질문 생성 시 사용)
# aliases : 본문/제목에서 이 클러스터를 식별하기 위한 표현들
#
# 클러스터를 추가하려면 항목을 하나 더 쓰면 됩니다. 코드 수정은 필요 없습니다.

clusters:
  - id: zero-trust
    hub: 제로 트러스트 세그멘테이션
    reader: 기존 경계 기반 보안에서 전환을 검토 중인 인프라·보안 담당자
    aliases: [제로 트러스트, zero trust, 마이크로세그멘테이션, ZTNA, 세그멘테이션]

  - id: sase
    hub: SD-WAN에서 SASE로의 전환
    reader: 지점망·원격근무 트래픽을 어떻게 묶을지 결정해야 하는 네트워크 담당자
    aliases: [SASE, SD-WAN, SSE, 보안 웹 게이트웨이, CASB]

  - id: cnapp
    hub: 클라우드 네이티브 애플리케이션 보안(CNAPP)
    reader: 컨테이너·쿠버네티스 환경의 보안 도구를 정리하려는 플랫폼 엔지니어
    aliases: [CNAPP, CSPM, CWPP, 컨테이너 보안, 클라우드 워크로드]

  - id: observability
    hub: eBPF 기반 클라우드 네이티브 관측성
    reader: 로그·메트릭·트레이스가 흩어져 장애 원인을 못 찾는 운영 담당자
    aliases: [eBPF, 관측성, Observability, 분산 추적, APM, 텔레메트리]

  - id: backup-dr
    hub: 기업용 백업·아카이빙과 재해 복구
    reader: 랜섬웨어와 규제 대응을 동시에 만족시켜야 하는 인프라 담당자
    aliases: [백업, 아카이빙, 재해 복구, DR, RPO, RTO, 이뮤터블]

  - id: ddos
    hub: DDoS 방어와 자동 대응 체계
    reader: 서비스 가용성을 책임지는 운영·보안 담당자
    aliases: [DDoS, 디도스, 트래픽 스크러빙, 볼류메트릭, 레이트 리밋]

  - id: workspace-security
    hub: 하이브리드 업무 환경 보안
    reader: 사무실 밖에서 접속하는 직원의 단말과 접근을 통제해야 하는 담당자
    aliases: [디지털 워크스페이스, VDI, DaaS, 원격근무 보안, 단말 보안, EDR]

  - id: multicloud-network
    hub: 멀티 클라우드 네트워크 설계
    reader: 여러 클라우드에 걸친 지연 시간과 전송 비용을 줄여야 하는 아키텍트
    aliases: [멀티 클라우드, 하이브리드 클라우드, 인터커넥트, 다이렉트 커넥트, 이그레스]

  - id: private-5g
    hub: 프라이빗 5G와 네트워크 슬라이싱
    reader: 공장·물류센터 무선망을 새로 설계하는 인프라 담당자
    aliases: [프라이빗 5G, 네트워크 슬라이싱, 로컬 5G, 산업용 무선]

  - id: edge-ai
    hub: 산업용 에지 AI
    reader: 현장 장비에서 추론을 돌려야 하는 제조·물류 기술 담당자
    aliases: [에지 AI, Edge AI, 온디바이스 추론, 스마트 팩토리, 비전 검사]

  - id: llmops
    hub: LLM 서비스 운영(LLMOps)
    reader: LLM 기반 서비스를 프로덕션에서 운영해야 하는 개발자·운영자
    aliases: [LLMOps, MLOps, 프롬프트 관리, 토큰 비용, 모델 평가, 할루시네이션]

  - id: ai-governance
    hub: 기업 생성형 AI 도입과 데이터 거버넌스
    reader: 사내 AI 도입에서 데이터 유출과 규제를 검토해야 하는 담당자
    aliases: [AI 거버넌스, 데이터 거버넌스, AI 규제, 프라이버시, RAG 보안]

  - id: serverless
    hub: 서버리스와 마이크로서비스 확장성
    reader: 트래픽 변동이 큰 서비스의 비용과 확장을 고민하는 백엔드 개발자
    aliases: [서버리스, Serverless, 람다, 마이크로서비스, 콜드 스타트, 오토스케일]

  - id: pqc
    hub: 양자 내성 암호(PQC) 전환
    reader: 장기 보관 데이터의 암호 수명을 검토해야 하는 보안 담당자
    aliases: [양자 내성 암호, PQC, Post-Quantum, 암호 민첩성, 키 교환]

# 뉴스 기반 글이 위 클러스터 어디에도 맞지 않을 때 쓰는 기본값.
# 이 클러스터에 글이 계속 쌓인다면 새 클러스터를 만들 때가 된 것입니다.
fallback_cluster:
  id: general
  hub: 그 외 기술 주제
  reader: IT 인프라·보안 전반을 살피는 실무자
  aliases: []

# 주간 배분 — 뉴스 기반 글은 6개월이면 죽는 자산이라 비중을 낮춥니다.
# 1=월 … 7=일 (KST 기준)
news_weekdays: [2, 4]
