# 일간 발행 — auto-09 / auto-12 / auto-15 / auto-18 네 개를 대체합니다.
#
# 왜 하루 1편인가
#   정보성 콘텐츠에서 일 4편은 손해입니다. 갱신할 여력이 없어지고, 같은 톤이
#   하루 네 번 반복되면 템플릿이 더 빨리 드러납니다. 발행량보다 정확성과 갱신이
#   자산입니다.
#
# 왜 concurrency 가 필요한가
#   기존에는 네 개 워크플로가 각자 main 에 rebase-push 했는데 동시성 제어가
#   없었습니다. 잡을 하나로 합치고 그룹을 걸어 경쟁 상태를 없앱니다.
#
# 스케줄이 주석 처리된 이유
#   새 파이프라인으로 발행된 글을 사람이 아직 충분히 검토하지 않았습니다.
#   workflow_dispatch 로 몇 번 돌려 결과를 확인한 뒤 아래 두 줄의 주석을 풀어 켜세요.

name: "Daily Post (09:00 KST)"

permissions:
  contents: write

on:
  # schedule:
  #   - cron: "0 0 * * *" # 00:00 UTC = 09:00 KST
  workflow_dispatch:
    inputs:
      cluster:
        description: "토픽 클러스터 id (비우면 가장 얇은 클러스터 자동 선택)"
        required: false
        type: string

concurrency:
  group: content-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # 주제는 scripts/topics.yaml 의 토픽 클러스터에서 자동 선정됩니다.
      # 글이 가장 적은 클러스터를 고르고, 그 안에서 아직 답하지 않은 질문을 찾습니다.
      # 뉴스 반영 여부도 topics.yaml 의 news_weekdays 가 결정합니다(기본 화·목).
      - name: Generate post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "${{ inputs.cluster }}" ]; then
            python scripts/main.py --cluster "${{ inputs.cluster }}"
          else
            python scripts/main.py
          fi

      # 소스로 답할 수 없어 파이프라인이 발행을 중단하면 생성물이 없습니다.
      # 이는 실패가 아니라 정상 동작이므로 여기서 조용히 종료합니다.
      - name: Detect generated content
        id: changed
        run: |
          if [ -n "$(git status --porcelain src/data/blog/)" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "생성물이 없습니다. 파이프라인이 발행을 중단했을 수 있습니다. 정상 종료합니다."
          fi

      # 1층 기계 검증 — 모델이 개입하지 않는 결정론적 게이트.
      # 프론트매터 / slug 중복 / 내부 링크 / 이미지 경로 / 도해 무결성.
      - name: Validate content
        if: steps.changed.outputs.any == 'true'
        run: python scripts/validate_content.py

      - name: Set up Node.js
        if: steps.changed.outputs.any == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        if: steps.changed.outputs.any == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node dependencies
        if: steps.changed.outputs.any == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build site
        if: steps.changed.outputs.any == 'true'
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee build_log.txt

      - name: Publish
        if: steps.changed.outputs.any == 'true'
        run: |
          python scripts/publish.py "Auto: daily post"

      # 진단만 합니다. 파일을 고치거나 push 하지 않습니다.
      - name: Diagnose failure
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/healer.py || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build_log.txt
            reports/
          if-no-files-found: ignore
          retention-days: 14
