name: Weekly Blog Post Audit

on:
  # schedule:
  #   - cron: '0 16 * * 0' # 01:00 KST Monday (16:00 UTC Sunday)
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Run Weekly Audit
        run: python scripts/validate_posts.py 8 # Check last 8 days to be safe
